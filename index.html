<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234B33">
<meta name="description" content="Medí la uniformidad espacial de siembra de maíz en el lote: CV, dobles, fallas y densidad lograda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uniformidad">
<title>Uniformidad de Siembra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de una pantalla — encabezado, vista desplazable, barra inferior de pestañas; la vista Medir lleva un teclado numérico grande para usar con el pulgar en el lote. */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --sunk:#E7ECE4; --ink:#17221B; --muted:#5B685F; --line:#D5DCD2;
  --brand:#234B33; --brand-ink:#FFFFFF; --accent:#E3A600; --accent-ink:#1E1700;
  --ok:#2E8B4B; --doble:#7246D8; --falla:#CF3A2E;
  --ok-bg:#E2F1E6; --doble-bg:#ECE6FA; --falla-bg:#FAE5E2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1410; --surface:#172019; --sunk:#111912; --ink:#E6ECE5; --muted:#98A59C; --line:#2A362D;
  --brand:#8FCB9F; --brand-ink:#0E1410; --accent:#F0B90B; --accent-ink:#1E1700;
  --ok:#55C178; --doble:#A98BF5; --falla:#FF6E61;
  --ok-bg:#183522; --doble-bg:#251C3D; --falla-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1410; --surface:#172019; --sunk:#111912; --ink:#E6ECE5; --muted:#98A59C; --line:#2A362D;
  --brand:#8FCB9F; --brand-ink:#0E1410; --accent:#F0B90B; --accent-ink:#1E1700;
  --ok:#55C178; --doble:#A98BF5; --falla:#FF6E61;
  --ok-bg:#183522; --doble-bg:#251C3D; --falla-bg:#3A1A17; color-scheme:dark}

html,body{height:100%}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto}
header.top{padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top .ttl{min-width:0;flex:1}
.top h1{margin:0;font:600 21px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
main{overflow-y:auto;overflow-x:hidden;min-height:0}
.view{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.2}

.lbl{font:600 12px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font:600 19px/1.15 var(--display);letter-spacing:.01em;text-wrap:balance}

/* Medir */
.medir{gap:10px;min-height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:baseline}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip.add{color:var(--muted);font-weight:500}
.obs{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink)}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.strip svg{display:block}
.strip .empty{padding:22px 14px;color:var(--muted);font-size:14px;text-align:center}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.live div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.live b{display:block;font:600 19px/1.1 var(--display)}
.live span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pad-wrap{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.display{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;min-height:62px}
.display .val{font:700 40px/1 var(--display);flex:1;min-width:0}
.display .val em{font-style:normal;font-size:18px;color:var(--muted);margin-left:4px;font-weight:500}
.display .val.ph{color:var(--muted);font-weight:500;font-size:22px}
.tag{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.doble{background:var(--doble-bg);color:var(--doble)} .tag.falla{background:var(--falla-bg);color:var(--falla)}
.edit-bar{display:flex;gap:8px;align-items:center;font-size:13.5px}
.edit-bar span{flex:1;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.danger{color:var(--falla);border-color:color-mix(in srgb,var(--falla) 40%,var(--line))}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,54px);gap:7px}
.pad button{border:0;border-radius:10px;background:var(--surface);box-shadow:0 1px 0 var(--line);font:600 26px/1 var(--display);touch-action:manipulation}
.pad button:active{background:var(--sunk)}
.pad .fn{background:var(--sunk);font-size:20px}
.pad .zero{grid-column:span 3}
.pad .ok{grid-column:4;grid-row:3/span 2;background:var(--accent);color:var(--accent-ink);font-size:22px;letter-spacing:.02em}
.pad .ok:active{filter:brightness(.92);background:var(--accent)}

/* Resultados */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.hero .big{font:700 52px/0.95 var(--display)}
.hero .big small{font-size:22px;font-weight:500;color:var(--muted);margin-left:2px}
.pill{font:600 15px/1 var(--body);padding:7px 12px;border-radius:999px;align-self:start;justify-self:end}
.c0{background:var(--ok-bg);color:var(--ok)} .c1{background:color-mix(in srgb,var(--ok-bg) 60%,var(--sunk));color:var(--ok)}
.c2{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:color-mix(in srgb,var(--accent) 55%,var(--ink))} .c3{background:var(--falla-bg);color:var(--falla)}
.hero .meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font:600 24px/1.1 var(--display)}
.kpi span{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card > .lbl{display:block;margin-bottom:8px}
.hist svg{width:100%;height:auto;display:block}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.03em}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);color:var(--muted);font-weight:500}
td.tot,th.tot{font-weight:700;color:var(--ink);background:var(--sunk)}
.note{font-size:12.5px;color:var(--muted)}

/* Ensayos */
.list{display:flex;flex-direction:column;gap:8px}
.ens{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%}
.ens.cur{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.ens strong{font:600 18px/1.15 var(--display)}
.ens .m{font-size:13px;color:var(--muted)}
.ens .pill{grid-row:1/span 2;grid-column:2;align-self:center;font-size:13px;padding:5px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:var(--falla-bg);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.confirm span{flex:1 1 180px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}

/* Ajustes */
.form{display:grid;gap:10px}
.field{display:grid;grid-template-columns:1fr 128px;align-items:center;gap:10px}
.field label{font-size:14.5px}
.field label small{display:block;color:var(--muted);font-size:12px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit;text-align:right}
.field.wide{grid-template-columns:1fr}
.field.wide input{text-align:left}
.calc{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:8px;padding:9px 12px}
.calc b{font:700 22px/1 var(--display)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="ttl"><h1 id="hTitle">Uniformidad de siembra</h1><div class="sub" id="hSub"></div></div>
    <div class="sync" id="sync"><i></i><span>En el teléfono</span></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="medir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 15h18M6 15v-3M10 15v-4M14 15v-3M18 15v-4"/><path d="M6 12c-1.5-1-1.5-3 0-4 1.5 1 1.5 3 0 4zM14 12c-1.5-1-1.5-3 0-4 1.5 1 1.5 3 0 4z"/></svg>Medir</button>
    <button data-tab="resultados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Resultados</button>
    <button data-tab="ensayos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Ensayos</button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Parámetros</button>
  </nav>
</div>

<script>
(function(){
"use strict";
const LS_KEY="uniformidad_siembra_v1";
const DEF_PARAMS={surco:0.52,densidad:80000,umbralD:0.5,umbralF:1.5};
const DEF_ESCALA=[0.2,0.3,0.4];
const CALIF=["Muy buena","Buena","Regular","Mala"];
const EJEMPLO=[23,27,23,22,19,23,4,26,22,25,28,27,43,22,16,15,20,22,26,24,27,5,27,27,25,21,18,20,41,29,27,25,22,6,19,21,21,32,23,20];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>n==null||!isFinite(n)?"–":n.toLocaleString("es-AR",{maximumFractionDigits:d,minimumFractionDigits:d});
const fmt0=n=>n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("es-AR");
const pct=(n,d=1)=>n==null||!isFinite(n)?"–":fmt(n*100,d)+" %";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- Cálculos (mismas fórmulas que la planilla) ---------- */
function objetivo(p){return 100/(p.densidad*p.surco/10000);}
function clase(v,p){const o=objetivo(p);if(v<p.umbralD*o)return"doble";if(v>p.umbralF*o)return"falla";return"ok";}
function stats(vals,p,escala){
  const n=vals.length,o=objetivo(p);
  const r={n,mean:null,sd:null,cv:null,dob:null,fal:null,ace:null,dens:null,logro:null,calif:null};
  if(!n)return r;
  const mean=vals.reduce((a,b)=>a+b,0)/n;r.mean=mean;
  r.dob=vals.filter(v=>v<p.umbralD*o).length/n;
  r.fal=vals.filter(v=>v>p.umbralF*o).length/n;
  r.ace=1-r.dob-r.fal;
  r.dens=10000/(p.surco*mean/100);r.logro=r.dens/p.densidad;
  if(n>=2){
    r.sd=Math.sqrt(vals.reduce((a,v)=>a+(v-mean)**2,0)/(n-1));
    r.cv=r.sd/mean;
    r.calif=r.cv<=escala[0]?0:r.cv<=escala[1]?1:r.cv<=escala[2]?2:3;
  }
  return r;
}
const allVals=e=>e.muestras.flatMap(m=>m.vals);

/* ---------- Estado ---------- */
function nuevoEnsayo(base){
  return {id:uid(),lote:"",hibrido:"",fecha:today(),sembradora:"",
    params:{...(base?base.params:DEF_PARAMS)},escala:[...(base?base.escala:DEF_ESCALA)],
    muestras:Array.from({length:5},()=>({obs:"",vals:[]})),createdAt:Date.now(),updatedAt:Date.now()};
}
function ejemplo(){
  const e=nuevoEnsayo();e.lote="Ejemplo";e.hibrido="Datos de la planilla";e.ejemplo=true;
  e.muestras[0].obs="Ejemplo – borrar";e.muestras[0].vals=[...EJEMPLO];return e;
}
let S={ensayos:{},cur:null,tab:"medir",m:0,tomb:[]};
try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);S={...S,...d};}}catch(_){}
if(!Object.keys(S.ensayos).length){const e=ejemplo();S.ensayos[e.id]=e;S.cur=e.id;}
if(!S.ensayos[S.cur])S.cur=Object.keys(S.ensayos)[0];
const ui={buf:"",sel:null,confirm:null};
const E=()=>S.ensayos[S.cur];

function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(_){}}
function touch(e){e.updatedAt=Date.now();persistLocal();queueSync(e.id);}

/* ---------- Sincronización con la cuenta (db) ---------- */
let db=null,me=null,col=null;const pend=new Set();let timer=null,busy=false;
function setSync(on,txt){const el=$("#sync");el.classList.toggle("on",on);el.querySelector("span").textContent=txt;}
function queueSync(id){if(!col)return;pend.add(id);clearTimeout(timer);timer=setTimeout(flush,1500);}
async function flush(){
  if(!col||busy)return;busy=true;
  try{
    for(const id of [...S.tomb]){try{await col.doc(id).delete();S.tomb=S.tomb.filter(x=>x!==id);}catch(_){}}
    for(const id of [...pend]){
      pend.delete(id);const e=S.ensayos[id];if(!e||e.ejemplo)continue;
      try{await col.doc(id).set(JSON.parse(JSON.stringify(e)));}
      catch(err){if(err&&err.code==="quota_exceeded"){toast("La cuenta llegó a su límite de ensayos guardados. Borrá alguno viejo.");}
        else pend.add(id);}
    }
    persistLocal();
    setSync(true,pend.size?"Pendiente":"En tu cuenta");
  }finally{busy=false;if(pend.size)timer=setTimeout(flush,8000);}
}
async function initSync(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;me=await u.id();if(!me)return;db=d;
    col=db.collection("data/users/"+me);
    const snap=await col.get();
    let changed=false;
    snap.docs.forEach(doc=>{
      const r=doc.data();if(!r||S.tomb.includes(doc.id))return;
      const l=S.ensayos[doc.id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){S.ensayos[doc.id]=JSON.parse(JSON.stringify(r));changed=true;}
    });
    // si hay ensayos reales, sacar el ejemplo
    Object.values(S.ensayos).forEach(e=>{if(!e.ejemplo&&!snap.docs.some(x=>x.id===e.id))pend.add(e.id);});
    if(changed){
      const real=Object.values(S.ensayos).filter(e=>!e.ejemplo);
      if(real.length&&E().ejemplo){S.cur=real.sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;}
      persistLocal();render();
    }
    setSync(true,"En tu cuenta");
    if(pend.size||S.tomb.length)flush();
  }catch(_){setSync(false,"En el teléfono");}
}

/* ---------- UI helpers ---------- */
let toastT;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}
const claseTxt={ok:"Aceptable",doble:"Doble",falla:"Falla"};
function header(){
  const e=E();$("#hTitle").textContent=e.lote||"Ensayo sin nombre";
  const bits=[e.hibrido,e.fecha&&e.fecha.split("-").reverse().join("/")].filter(Boolean);
  $("#hSub").textContent=bits.join(" · ")||"Cargá lote e híbrido en Parámetros";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
}

/* ---------- Vista: Medir ---------- */
function stripSVG(e,m){
  const vals=e.muestras[m].vals,p=e.params;
  if(!vals.length)return `<div class="empty">Medí la distancia entre plantas consecutivas del surco y cargala abajo, en centímetros.</div>`;
  const k=3.2,pad=18,H=86,base=58;let x=pad;const xs=[x];vals.forEach(v=>{x+=Math.max(v,3)*k;xs.push(x);});
  const W=Math.max(x+pad,300);let g="";
  vals.forEach((v,i)=>{
    const c=clase(v,p),x1=xs[i],x2=xs[i+1],mx=(x1+x2)/2,sel=ui.sel===i;
    g+=`<g data-act="sel" data-i="${i}" style="cursor:pointer">
      <rect x="${x1}" y="6" width="${x2-x1}" height="${H-8}" fill="${sel?"var(--sunk)":"transparent"}"/>
      <line x1="${x1}" y1="${base}" x2="${x2}" y2="${base}" stroke="var(--${c})" stroke-width="${sel?5:3}"/>
      <text x="${mx}" y="${base-12}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-size="${(x2-x1)<26?12:15}" font-weight="600" fill="var(--${c==="ok"?"ink":c})">${fmt(v,v%1?1:0)}</text>

function key(k){

/* ---------- Vista: Resultados ---------- */
function histSVG(vals,p){
  if(!vals.length)return `<p class="note">Sin datos todavía.</p>`;
  const o=objetivo(p),max=Math.max(...vals,p.umbralF*o*1.25),bw=2,nb=Math.ceil(max/bw);
  const bins=Array(nb).fill(0).map((_,i)=>({x0:i*bw,n:0}));
  vals.forEach(v=>{bins[Math.min(nb-1,Math.floor(v/bw))].n++;});
  const W=340,H=170,l=26,r=8,t=14,b=26,iw=W-l-r,ih=H-t-b,mx=Math.max(...bins.map(b=>b.n));
  const sx=v=>l+v/(nb*bw)*iw,sy=n=>t+ih-n/mx*ih;
  let g="";const step=mx<=5?1:Math.ceil(mx/4);
  for(let n=0;n<=mx;n+=step)g+=`<line x1="${l}" x2="${W-r}" y1="${sy(n)}" y2="${sy(n)}" stroke="var(--line)"/><text x="${l-5}" y="${sy(n)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${n}</text>`;
  bins.forEach(bn=>{if(!bn.n)return;const c=clase(bn.x0+bw/2,p);g+=`<rect x="${sx(bn.x0)+.5}" y="${sy(bn.n)}" width="${Math.max(sx(bw)-l-1,1)}" height="${t+ih-sy(bn.n)}" fill="var(--${c})" rx="1"/>`;});
  [[p.umbralD*o,"doble"],[o,"ink"],[p.umbralF*o,"falla"]].forEach(([v,c],i)=>{
    g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${t-4}" y2="${t+ih}" stroke="var(--${c})" stroke-dasharray="${i===1?"none":"3 3"}" stroke-width="1.2"/>`;
  });
  g+=`<text x="${sx(o)}" y="${t-5}" text-anchor="middle" font-size="10" fill="var(--ink)">objetivo ${fmt(o)}</text>`;
  const tk=max>80?20:10;for(let v=0;v<=nb*bw;v+=tk)g+=`<text x="${sx(v)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${v}</text>`;
  g+=`<text x="${W-r}" y="${H-1}" text-anchor="end" font-size="10" fill="var(--muted)">cm</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Barlow,sans-serif" role="img" aria-label="Histograma de espaciamientos">${g}</svg>`;
}
function vResultados(){
  const e=E(),p=e.params,vals=allVals(e),L=stats(vals,p,e.escala);
  const cols=e.muestras.map((m,i)=>({h:"M"+(i+1),s:stats(m.vals,p,e.escala)})).filter(c=>c.s.n);
  cols.push({h:"Lote",s:L,tot:true});
  const rows=[["Distancias (n)",s=>s.n],["Media (cm)",s=>fmt(s.mean)],["Desvío (cm)",s=>fmt(s.sd)],["CV",s=>pct(s.cv)],
    ["Dobles",s=>pct(s.dob)],["Fallas",s=>pct(s.fal)],["Aceptables",s=>pct(s.ace)],["Densidad (pl/ha)",s=>fmt0(s.dens)],
    ["Logro vs. objetivo",s=>pct(s.logro,0)],["Calificación",s=>s.calif==null?"–":CALIF[s.calif]]];
  const tbl=`<table class="num"><thead><tr><th>Indicador</th>${cols.map(c=>`<th class="${c.tot?"tot":""}">${c.h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(([n,f])=>`<tr><td>${n}</td>${cols.map(c=>`<td class="${c.tot?"tot":""}">${f(c.s)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return `<section class="view">
    <div class="hero">
      <div><span class="lbl">CV del lote</span><div class="big num">${L.cv==null?"–":fmt(L.cv*100,1)}<small>%</small></div></div>
      ${L.calif!=null?`<span class="pill c${L.calif}">${CALIF[L.calif]}</span>`:`<span class="pill c2">Faltan datos</span>`}
      <div class="meta num">${L.n} distancias en ${cols.length-1} muestra${cols.length-1===1?"":"s"} · media ${fmt(L.mean)} cm (objetivo ${fmt(objetivo(p))} cm)</div>
    </div>
    <div class="card">
      <span class="lbl">Distribución de espaciamientos</span>
      <div class="stack" aria-hidden="true"><i style="width:${(L.dob||0)*100}%;background:var(--doble)"></i><i style="width:${(L.ace||0)*100}%;background:var(--ok)"></i><i style="width:${(L.fal||0)*100}%;background:var(--falla)"></i></div>
      <div class="legend num" style="margin-top:8px"><span><i style="background:var(--doble)"></i>Dobles ${pct(L.dob)}</span><span><i style="background:var(--ok)"></i>Aceptables ${pct(L.ace)}</span><span><i style="background:var(--falla)"></i>Fallas ${pct(L.fal)}</span></div>
    </div>
    <div class="kpis num">
      <div class="kpi"><b>${fmt0(L.dens)}</b><span>Densidad lograda (pl/ha)</span></div>
      <div class="kpi"><b>${pct(L.logro,0)}</b><span>Logro vs. ${fmt0(p.densidad)} pl/ha</span></div>
    </div>
    <div class="card hist"><span class="lbl">Histograma (cada 2 cm)</span>${histSVG(vals,p)}</div>
    <div><span class="lbl" style="display:block;margin-bottom:8px">Por muestra</span><div class="tblwrap">${tbl}</div></div>
    <p class="note">Doble: espaciamiento menor a ${fmt(p.umbralD,2)} × objetivo (${fmt(p.umbralD*objetivo(p))} cm). Falla: mayor a ${fmt(p.umbralF,2)} × objetivo (${fmt(p.umbralF*objetivo(p))} cm). Kachman &amp; Smith, 1995. La densidad lograda es una estimación: 10.000 / (distancia entre surcos × espaciamiento medio).</p>
  </section>`;
}

function resumen(e){
  const s=stats(allVals(e),e.params,e.escala),p=e.params;
  return [`Uniformidad de siembra – ${e.lote||"Lote"}`,
    [e.hibrido&&"Híbrido: "+e.hibrido,e.fecha&&"Fecha: "+e.fecha.split("-").reverse().join("/"),e.sembradora&&"Sembradora: "+e.sembradora].filter(Boolean).join(" | "),
    `Distancias medidas: ${s.n}`,`Espaciamiento medio: ${fmt(s.mean)} cm (objetivo ${fmt(objetivo(p))} cm)`,
    `CV: ${pct(s.cv)} → ${s.calif==null?"–":CALIF[s.calif]}`,
    `Dobles: ${pct(s.dob)} · Fallas: ${pct(s.fal)} · Aceptables: ${pct(s.ace)}`,
    `Densidad lograda: ${fmt0(s.dens)} pl/ha (${pct(s.logro,0)} de ${fmt0(p.densidad)})`].filter(Boolean).join("\n");
}
function csv(e){
  const p=e.params,f=n=>n==null||!isFinite(n)?"":String(Math.round(n*10000)/10000).replace(".",",");
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;const L=[];
  L.push([q("Uniformidad espacial de siembra – Maíz")].join(";"));
  [["Lote",e.lote],["Híbrido",e.hibrido],["Fecha de siembra",e.fecha],["Sembradora / operario",e.sembradora]].forEach(r=>L.push(q(r[0])+";"+q(r[1])));
  [["Distancia entre surcos (m)",p.surco],["Densidad objetivo (pl/ha)",p.densidad],["Espaciamiento objetivo (cm)",objetivo(p)],["Umbral dobles (× objetivo)",p.umbralD],["Umbral fallas (× objetivo)",p.umbralF]].forEach(r=>L.push(q(r[0])+";"+f(r[1])));
  L.push("");L.push(["N°",...e.muestras.map((_,i)=>"Muestra "+(i+1))].map(q).join(";"));
  L.push([q("Ubicación / obs."),...e.muestras.map(m=>q(m.obs))].join(";"));
  const mx=Math.max(0,...e.muestras.map(m=>m.vals.length));
  for(let i=0;i<mx;i++)L.push([i+1,...e.muestras.map(m=>f(m.vals[i]))].join(";"));
  L.push("");const cols=e.muestras.map(m=>stats(m.vals,p,e.escala));const T=stats(allVals(e),p,e.escala);
  L.push(["Indicador",...e.muestras.map((_,i)=>"Muestra "+(i+1)),"Lote (total)"].map(q).join(";"));
  [["Distancias medidas (n)","n"],["Espaciamiento medio (cm)","mean"],["Desvío estándar (cm)","sd"],["CV (%)","cv",100],["Dobles (%)","dob",100],["Fallas (%)","fal",100],["Aceptables (%)","ace",100],["Densidad lograda (pl/ha)","dens"],["Logro vs. objetivo (%)","logro",100]]
    .forEach(([n,k,m])=>L.push([q(n),...cols.map(s=>s.n?f(s[k]==null?null:s[k]*(m||1)):""),f(T[k]==null?null:T[k]*(m||1))].join(";")));
  L.push([q("Calificación (por CV)"),...cols.map(s=>q(s.calif==null?"":CALIF[s.calif])),q(T.calif==null?"":CALIF[T.calif])].join(";"));
  return "﻿"+L.join("\r\n");
}

function onField(el){
  const e=E(),f=el.dataset.f,v=el.value;
  if(["lote","hibrido","fecha","sembradora"].includes(f)){e[f]=v;if(e.ejemplo&&f==="lote")delete e.ejemplo;header();}
  else{const n=parseFloat(v);if(!(n>0))return;
    if(f[0]==="e")e.escala[+f[1]]=n/100;else e.params[f]=n;
    const o=$("#objOut");if(o)o.textContent=fmt(objetivo(e.params),2)+" cm";}

document.addEventListener("visibilitychange",()=>{if(S.tab==="medir")wakeOn();});

initSync();
})();
